services:
  backend:
    build:
      context: ./backend
      dockerfile: WeatherDashboard.Api/Dockerfile
    ports:
      - "5299:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Cors__AllowedOrigins__0: http://localhost:5173

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5299
        VITE_MAP_TILE_URL: https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png
    ports:
      - "5173:80"
    depends_on:
      - backend
